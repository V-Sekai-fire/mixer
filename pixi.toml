[workspace]
name = "mixer"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[dependencies]
python = "3.13.*"
cryptography = "*"
hypothesis = ">=6.100"
pytest = "*"
prek = "*"
black = "*"
mypy = ">=2.4.1,<3"

[pypi-dependencies]
# HTTP/3 + WebTransport (BSD-3-Clause). The only network protocol Mixer speaks.
aioquic = ">=1.2"
zstandard = ">=0.25.0, <0.26"

[tasks]
# Hypothesis is the only test framework; pytest is merely the runner Hypothesis ships a plugin for.
test = "python -m pytest tests/hypo -p no:cacheprovider -x -q"
lint = "prek run --all-files"
# Type hints are required in the modules listed under [tool.mypy] in pyproject.toml.
typecheck = "mypy"
frontier = "python -m pytest tests/hypo/test_frontier.py -p no:cacheprovider -q -s"

# Blender as the `bpy` PyPI module (needs Python 3.13): a separate backend/platform from the Blender executable,
# available on every OS the wheels cover.
[feature.bpy]
platforms = ["linux-64", "osx-arm64", "win-64"]

[feature.bpy.dependencies]
python = "3.13.*"

[feature.bpy.pypi-dependencies]
bpy = "==5.3.0"

[feature.bpy.tasks]
test-bpy = { cmd = "python -m pytest tests/hypo -p no:cacheprovider -x -q", env = { MIXER_BACKEND = "bpy" } }

[environments]
bpy = { features = ["bpy"], solve-group = "bpy" }
