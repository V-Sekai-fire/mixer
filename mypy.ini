[mypy]
python_version = 3.13
namespace_packages = True
ignore_missing_imports = True
# Only the modules listed in `files` are checked; what they import is read but not reported.
follow_imports = silent
files =
    mixer/broadcaster/entity.py,
    mixer/broadcaster/geo_publish.py,
    mixer/broadcaster/relay.py,
    mixer/broadcaster/relay_transport.py,
    mixer/broadcaster/s3.py,
    mixer/entity_sync.py

# The older add-on code (Ubisoft's) has no type hints and is not required to.
[mypy-mixer.*]
ignore_errors = True

[mypy-mixer.blender_data.*]
ignore_errors = False

# Modules written for the relay: every function is typed.
[mypy-mixer.broadcaster.entity,mixer.broadcaster.geo_publish,mixer.broadcaster.relay,mixer.broadcaster.relay_transport,mixer.broadcaster.s3,mixer.entity_sync]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
no_implicit_optional = True
