name: ci

on:
  push:
    branches: [master]
  pull_request:
  merge_group:  # the merge queue builds the combined result once, here

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hypothesis:
    name: ${{ matrix.backend }} ${{ matrix.blender }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # blender: the official Blender executable. bpy: Blender as the pip "bpy" module, a separate platform.
        backend: [blender, bpy]
        blender: ["5.3.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          environments: ${{ matrix.backend == 'bpy' && 'bpy' || 'default' }}
          cache: true
      - name: Linux libraries for headless Blender
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6
      - name: Get Blender executable
        if: matrix.backend == 'blender'
        shell: bash
        run: |
          exe=$(pixi run python tests/hypo/get_blender.py ${{ matrix.blender }} "$RUNNER_TEMP/blender" | tail -1)
          echo "MIXER_BLENDER_EXE_PATH=$exe" >> "$GITHUB_ENV"
          "$exe" --version
      - name: Hypothesis tests (server + two Blender clients), blender backend
        if: matrix.backend == 'blender'
        run: pixi run test
      - name: Hypothesis tests (server + two Blender clients), bpy backend
        if: matrix.backend == 'bpy'
        run: pixi run -e bpy test-bpy
